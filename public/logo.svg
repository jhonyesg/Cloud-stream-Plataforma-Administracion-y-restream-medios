    <path d="M80 168c-26.4 0-48-20.4-48-45.6 0-22.8 16.8-41.6 38.8-45.2C77.2 48 101.6 28 130.8 28c31.2 0 56.8 23.2 60 53.2 0.8 0 1.6 0 2.4 0 24.8 0 44.8 19.2 44.8 42.8s-20 42.8-44.8 42.8H80z"
