<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cloudstream">
    <title>Cloudstream</title>
    <defs>
        <linearGradient id="cs-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1e1b4b"/>
            <stop offset="100%" stop-color="#0c0a2e"/>
        </linearGradient>
        <linearGradient id="cs-cloud" x1="40" y1="30" x2="220" y2="200" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#818cf8"/>
            <stop offset="50%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
        <linearGradient id="cs-play" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fef3c7"/>
            <stop offset="50%" stop-color="#f472b6"/>
            <stop offset="100%" stop-color="#a855f7"/>
        </linearGradient>
        <radialGradient id="cs-glow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
        </radialGradient>
